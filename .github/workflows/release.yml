# Pushing a tag like v1.0.0 builds Stopwatch.exe and publishes it as a GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Same settings as publish.ps1: one framework-dependent .exe.
      - name: Publish
        run: dotnet publish Stopwatch.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=None -o dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/Stopwatch.exe --title "Stopwatch ${{ github.ref_name }}" --notes-file .github/release-notes.md
